[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tiny-mp-cache"
version = "0.2.1"
description = "1μs multiprocessing cache (TCP/Unix socket)"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Nikita Ilin"}]
readme = "README.md"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]

[tool.maturin]
module-name = "tiny_mp_cache"
python-packages = ["tiny_mp_cache"]


[project.urls]
Homepage = "https://github.com/NVI87/tiny-mp-cache"
Source = "https://github.com/NVI87/tiny-mp-cache"